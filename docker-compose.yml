# Local development database for PocketPay.
# Start: docker compose up -d     Stop: docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: pocketpay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocketpay
      POSTGRES_PASSWORD: pocketpay
      POSTGRES_DB: pocketpay
    ports:
      - "5433:5432"
    volumes:
      - pocketpay_pgdata:/var/lib/postgresql/data
      # SQL in this folder runs on first start of a fresh volume (creates pocketpay_test).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketpay -d pocketpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pocketpay_pgdata: